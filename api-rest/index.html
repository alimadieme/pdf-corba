<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenPDF — Outils PDF en ligne</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D1B3E;
  --navy2: #1A2E5A;
  --blue: #1565C0;
  --blue2: #1976D2;
  --green: #2E7D32;
  --green2: #388E3C;
  --bg: #F5F7FA;
  --white: #FFFFFF;
  --gray: #78909C;
  --gray2: #ECEFF1;
  --dark: #1A237E;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--dark); }

/* NAV */
nav {
  background: var(--navy);
  padding: 0 40px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.nav-logo { display:flex; align-items:center; gap:8px; text-decoration:none; }
.nav-logo span:first-child { font-size:20px; font-weight:700; color:white; }
.nav-logo span:last-child { font-size:20px; font-weight:700; color:#4FC3F7; }
.nav-right { display:flex; align-items:center; gap:16px; }
.nav-statut { font-size:12px; color:#69F0AE; }
.nav-user { font-size:13px; color:#B0BEC5; }
.btn-logout {
  padding:7px 16px;
  background:transparent;
  border:1px solid #455A64;
  border-radius:6px;
  color:#B0BEC5;
  font-size:13px;
  cursor:pointer;
  transition:all 0.2s;
}
.btn-logout:hover { background:#1A2E5A; color:white; }

/* AUTH */
#authOverlay {
  position:fixed; inset:0;
  background:rgba(13,27,62,0.95);
  backdrop-filter:blur(8px);
  z-index:1000;
  display:flex; align-items:center; justify-content:center;
}
.auth-box {
  background:var(--white);
  border-radius:16px;
  width:400px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.auth-header {
  background:var(--navy);
  padding:28px;
  text-align:center;
}
.auth-header .logo { font-size:24px; font-weight:700; }
.auth-header .logo span:first-child { color:white; }
.auth-header .logo span:last-child { color:#4FC3F7; }
.auth-header p { color:#78909C; font-size:13px; margin-top:6px; }
.auth-tabs { display:flex; border-bottom:1px solid var(--gray2); }
.auth-tab {
  flex:1; padding:14px; text-align:center;
  font-size:14px; font-weight:500;
  cursor:pointer; color:var(--gray);
  border-bottom:2px solid transparent;
  transition:all 0.2s;
}
.auth-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.auth-form { padding:24px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:var(--gray); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px; }
.form-group input {
  width:100%; padding:10px 14px;
  border:1.5px solid var(--gray2);
  border-radius:8px; font-size:14px;
  font-family:'Inter',sans-serif;
  color:var(--dark); outline:none;
  transition:border-color 0.2s;
}
.form-group input:focus { border-color:var(--blue); }
.btn-auth {
  width:100%; padding:12px;
  background:var(--blue);
  color:white; border:none;
  border-radius:8px; font-size:14px;
  font-weight:600; cursor:pointer;
  font-family:'Inter',sans-serif;
  transition:background 0.2s;
  margin-top:4px;
}
.btn-auth:hover { background:var(--navy2); }
.auth-error {
  background:#FEE2E2; color:#991B1B;
  padding:9px 12px; border-radius:6px;
  font-size:13px; margin-bottom:12px; display:none;
}

/* LAYOUT */
.layout { display:flex; min-height:calc(100vh - 64px - 44px); }

/* SIDEBAR */
.sidebar {
  width:220px; min-height:100%;
  background:var(--navy2);
  padding:16px 10px;
  flex-shrink:0;
}
.sidebar-title {
  font-size:10px; font-weight:700;
  color:#546E7A; padding:8px 12px 12px;
  letter-spacing:1.5px; text-transform:uppercase;
}
.sidebar-btn {
  display:block; width:100%;
  padding:10px 16px; text-align:left;
  background:transparent; border:none;
  color:#B0BEC5; font-size:13px;
  cursor:pointer; border-radius:8px;
  font-family:'Inter',sans-serif;
  transition:all 0.2s; margin-bottom:2px;
}
.sidebar-btn:hover, .sidebar-btn.active {
  background:#1A3A5C; color:white;
}

/* MAIN */
.main { flex:1; padding:30px; }

/* STATUT */
.statut-bar {
  background:var(--white);
  border:1px solid var(--gray2);
  border-radius:8px;
  padding:8px 16px;
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; color:var(--gray);
  margin-bottom:24px;
}
.statut-dot { width:8px; height:8px; border-radius:50%; background:#EF4444; }
.statut-dot.online { background:#2E7D32; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* CARTE TITRE */
.titre-card {
  background:var(--white);
  border:1px solid var(--gray2);
  border-radius:12px;
  padding:20px 24px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  border-left:4px solid var(--blue);
}
.titre-card h2 { font-size:20px; font-weight:700; color:var(--blue); }
.titre-card p { font-size:13px; color:var(--gray); margin-top:4px; }

/* CARTE CONTENU */
.content-card {
  background:var(--white);
  border:1px solid var(--gray2);
  border-radius:12px;
  padding:24px;
  box-shadow:var(--shadow);
}
.form-label {
  font-size:12px; font-weight:600;
  color:var(--dark); margin-bottom:8px;
  display:block; text-transform:uppercase;
  letter-spacing:0.5px;
}
.upload-zone {
  border:2px dashed #B0BEC5;
  border-radius:10px; padding:28px;
  text-align:center; cursor:pointer;
  transition:all 0.2s; margin-bottom:8px;
  background:#F8FAFC;
}
.upload-zone:hover { border-color:var(--blue2); background:#E3F2FD; }
.upload-zone p { font-size:13px; color:var(--gray); }
.file-name { font-size:12px; color:var(--gray); margin-bottom:16px; }
.file-name.selected { color:var(--green); font-weight:500; }
.input-field {
  width:100%; padding:10px 14px;
  border:1.5px solid var(--gray2);
  border-radius:8px; font-size:14px;
  font-family:'Inter',sans-serif;
  color:var(--dark); outline:none;
  margin-bottom:16px; background:var(--white);
  transition:border-color 0.2s;
}
.input-field:focus { border-color:var(--blue); }
.input-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.btn-run {
  width:100%; padding:12px;
  background:var(--green);
  color:white; border:none;
  border-radius:8px; font-size:14px;
  font-weight:600; cursor:pointer;
  font-family:'Inter',sans-serif;
  transition:background 0.2s; margin-top:8px;
}
.btn-run:hover { background:var(--green2); }
.btn-run:disabled { background:var(--gray2); cursor:not-allowed; }
.result-box {
  margin-top:14px; padding:12px 16px;
  border-radius:8px; font-size:13px; display:none;
}
.result-box.success { background:#E8F5E9; color:#1B5E20; border:1px solid #A5D6A7; display:block; }
.result-box.error { background:#FFEBEE; color:#B71C1C; border:1px solid #EF9A9A; display:block; }
.spinner {
  display:inline-block; width:14px; height:14px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:white; border-radius:50%;
  animation:spin 0.8s linear infinite;
  vertical-align:middle; margin-right:6px;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* FOOTER */
footer {
  background:var(--navy);
  text-align:center; padding:12px;
  font-size:12px; color:#546E7A;
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo"><span>Sen</span><span>PDF</span></div>
      <p>La plateforme PDF du Senegal</p>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">Connexion</div>
      <div class="auth-tab" onclick="switchTab('register')">Inscription</div>
    </div>
    <div class="auth-form">
      <div class="auth-error" id="authError"></div>
      <div id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="vous@exemple.com"></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
        <button class="btn-auth" onclick="login()">Se connecter</button>
      </div>
      <div id="registerForm" style="display:none">
        <div class="form-group"><label>Nom complet</label><input type="text" id="regName" placeholder="Votre nom"></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="vous@exemple.com"></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="regPassword" placeholder="Min. 6 caracteres"></div>
        <button class="btn-auth" onclick="register()">Creer mon compte</button>
      </div>
    </div>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="nav-logo"><span>Sen</span><span>PDF</span></div>
  <div class="nav-right">
    <span class="nav-statut" id="navStatut">Connexion...</span>
    <span class="nav-user" id="navUser">👤</span>
    <button class="btn-logout" onclick="logout()">Deconnexion</button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-title">Outils PDF</div>
    <button class="sidebar-btn active" onclick="showTool(this,'fusion')">Fusionner PDF</button>
    <button class="sidebar-btn" onclick="showTool(this,'decoupage')">Decouper PDF</button>
    <button class="sidebar-btn" onclick="showTool(this,'extrairePages')">Extraire pages</button>
    <button class="sidebar-btn" onclick="showTool(this,'supprimerPages')">Supprimer pages</button>
    <button class="sidebar-btn" onclick="showTool(this,'motDePasse')">Proteger PDF</button>
    <button class="sidebar-btn" onclick="showTool(this,'convertirImage')">PDF vers Image</button>
    <button class="sidebar-btn" onclick="showTool(this,'extraireTexte')">Extraire texte</button>
    <button class="sidebar-btn" onclick="showTool(this,'creerPdf')">Creer PDF</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="statut-bar">
      <div class="statut-dot" id="statutDot"></div>
      <span id="statutText">Verification...</span>
    </div>
    <div id="toolArea"></div>
  </div>
</div>

<footer>SenPDF 2026</footer>

<script>
const API = window.location.origin + '/api';

// ===== AUTH =====
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display = tab==='register'?'block':'none';
  document.getElementById('authError').style.display = 'none';
}
function showError(msg) { const e=document.getElementById('authError'); e.textContent=msg; e.style.display='block'; }
function login() {
  const email=document.getElementById('loginEmail').value.trim();
  const pwd=document.getElementById('loginPassword').value;
  if(!email||!pwd){showError('Remplissez tous les champs');return;}
  const users=JSON.parse(localStorage.getItem('senpdf_users')||'[]');
  const user=users.find(u=>u.email===email&&u.password===btoa(pwd));
  if(!user){showError('Email ou mot de passe incorrect');return;}
  localStorage.setItem('senpdf_session',JSON.stringify(user));
  onLogin(user);
}
function register() {
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pwd=document.getElementById('regPassword').value;
  if(!name||!email||!pwd){showError('Remplissez tous les champs');return;}
  if(pwd.length<6){showError('Mot de passe trop court');return;}
  const users=JSON.parse(localStorage.getItem('senpdf_users')||'[]');
  if(users.find(u=>u.email===email)){showError('Email deja utilise');return;}
  const user={name,email,password:btoa(pwd)};
  users.push(user);
  localStorage.setItem('senpdf_users',JSON.stringify(users));
  localStorage.setItem('senpdf_session',JSON.stringify(user));
  onLogin(user);
}
function onLogin(user) {
  document.getElementById('authOverlay').style.display='none';
  document.getElementById('navUser').textContent='👤 '+user.name;
}
function logout() { localStorage.removeItem('senpdf_session'); location.reload(); }
window.addEventListener('load',()=>{
  const u=JSON.parse(localStorage.getItem('senpdf_session')||'null');
  if(u) onLogin(u);
  checkStatut();
  showTool(document.querySelector('.sidebar-btn'),'fusion');
});

// ===== STATUT =====
async function checkStatut() {
  try {
    const r=await fetch(API+'/health');
    const d=await r.json();
    if(d.status==='OK'){
      document.getElementById('statutDot').className='statut-dot online';
      document.getElementById('statutText').textContent='Service operationnel';
      document.getElementById('navStatut').textContent='Connecte';
    }
  } catch(e) {
    document.getElementById('statutText').textContent='Service indisponible';
    document.getElementById('navStatut').textContent='Deconnecte';
    document.getElementById('navStatut').style.color='#EF4444';
  }
}
setInterval(checkStatut,10000);

// ===== OUTILS =====
const outils = {
  fusion:{titre:'Fusionner des PDFs',desc:'Combinez plusieurs PDFs en un seul document'},
  decoupage:{titre:'Decouper un PDF',desc:'Extrayez une plage de pages specifique'},
  extrairePages:{titre:'Extraire des pages',desc:'Isolez des pages dans un nouveau fichier'},
  supprimerPages:{titre:'Supprimer des pages',desc:'Retirez des pages indesirables'},
  motDePasse:{titre:'Proteger un PDF',desc:'Securisez votre document par mot de passe'},
  convertirImage:{titre:'PDF vers Image',desc:'Convertissez vos pages en PNG'},
  extraireTexte:{titre:'Extraire le texte',desc:'Recuperez tout le contenu textuel'},
  creerPdf:{titre:'Creer un PDF',desc:'Generez un nouveau document PDF'}
};

function showTool(btn, op) {
  document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const o=outils[op];
  let extra='';
  if(op==='fusion') extra=`
    <label class="form-label">Deuxieme fichier PDF</label>
    <div class="upload-zone" onclick="selectFile(2)"><p>Cliquez pour selectionner un PDF</p></div>
    <div class="file-name" id="fn2">Aucun fichier selectionne</div>`;
  else if(op==='decoupage'||op==='extrairePages') extra=`
    <div class="input-row">
      <input class="input-field" id="pageDebut" type="number" placeholder="Page debut" min="1">
      <input class="input-field" id="pageFin" type="number" placeholder="Page fin" min="1">
    </div>`;
  else if(op==='supprimerPages') extra=`<input class="input-field" id="pages" placeholder="Pages a supprimer (ex: 2,4,6)">`;
  else if(op==='motDePasse') extra=`<input class="input-field" id="mdp" type="password" placeholder="Mot de passe">`;
  else if(op==='creerPdf') extra=`<textarea class="input-field" id="contenu" rows="5" placeholder="Contenu du PDF..."></textarea>`;

  document.getElementById('toolArea').innerHTML=`
    <div class="titre-card">
      <h2>${o.titre}</h2>
      <p>${o.desc}</p>
    </div>
    <div class="content-card">
      <label class="form-label">Fichier PDF</label>
      <div class="upload-zone" onclick="selectFile(1)"><p>Cliquez pour selectionner un PDF</p></div>
      <div class="file-name" id="fn1">Aucun fichier selectionne</div>
      ${extra}
      <button class="btn-run" id="btnRun" onclick="run('${op}')">Executer</button>
      <div class="result-box" id="res"></div>
    </div>`;
  window._f1=null; window._f2=null;
}

async function selectFile(num) {
  const input=document.createElement('input');
  input.type='file'; input.accept='.pdf';
  input.onchange=async e=>{
    const f=e.target.files[0];
    if(!f) return;
    // Upload le fichier sur le serveur
    const formData = new FormData();
    formData.append('file', f);
    try {
      const r = await fetch(API+'/upload', {method:'POST', body:formData});
      const d = await r.json();
      if(d.path) {
        if(num===1){ window._f1path=d.path; window._f1name=f.name; document.getElementById('fn1').textContent='✓ '+f.name; document.getElementById('fn1').className='file-name selected'; }
        else { window._f2path=d.path; window._f2name=f.name; document.getElementById('fn2').textContent='✓ '+f.name; document.getElementById('fn2').className='file-name selected'; }
      }
    } catch(err) {
      console.error('Upload erreur:', err);
    }
  };
  input.click();
}

async function run(op) {
  const btn=document.getElementById('btnRun');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Traitement...';
  const res=document.getElementById('res');
  res.className='result-box';

  try {
    let body='', endpoint='';
    const f1name = window._f1path || 'doc1.pdf';
    const f2name = window._f2path || 'doc2.pdf';

    switch(op) {
      case 'fusion': body=f1name+'|'+f2name; endpoint='fusion'; break;
      case 'decoupage': body=f1name+'|'+(document.getElementById('pageDebut')?.value||1)+'|'+(document.getElementById('pageFin')?.value||1); endpoint='decoupage'; break;
      case 'extrairePages': body=f1name+'|'+(document.getElementById('pageDebut')?.value||1)+'|'+(document.getElementById('pageFin')?.value||1); endpoint='extrairePages'; break;
      case 'supprimerPages': body=f1name+'|'+(document.getElementById('pages')?.value||''); endpoint='supprimerPages'; break;
      case 'motDePasse': body=f1name+'|'+(document.getElementById('mdp')?.value||''); endpoint='ajouterMotDePasse'; break;
      case 'convertirImage': body=f1name; endpoint='convertirEnImage'; break;
      case 'extraireTexte': body=f1name; endpoint='extraireTexte'; break;
      case 'creerPdf': body=document.getElementById('contenu')?.value||''; endpoint='creerPdf'; break;
    }

    const r=await fetch(API+'/'+endpoint,{method:'POST',body});
    const d=await r.json();
    const val=d.resultat||d.texte||'OK';
    res.className='result-box '+(val.startsWith('OK')||d.texte?'success':'error');
    res.textContent=val;
  } catch(e) {
    res.className='result-box error';
    res.textContent='Erreur: '+e.message;
  }
  btn.disabled=false;
  btn.innerHTML='Executer';
}
</script>
</body>
</html>
